# Status line: two rows, window pills at the bottom.

set -g status-position bottom
# Empty row between the panes and the status line: the status line takes two
# rows and the default format moves to the lower one.
set -g status 2
set -gu status-format
run-shell 'tmux set -g "status-format[1]" "$(tmux show -gv "status-format[0]")" \; set -g "status-format[0]" ""'
# Pill title: the folder name (Claude's own folder while it runs).
set -g @tab-title "#{?#{==:${WORK_DIR},$HOME},~,#{s|.*/||:${WORK_DIR}}}"

set -g status-left ""
set -g status-right "#{?client_prefix,#[fg=${PREFIX_FG}]#[bg=${PREFIX_BG}]#[bold] PREFIX #[default],}"
