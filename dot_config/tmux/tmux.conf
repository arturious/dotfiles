# Entry point: the parts are sourced in this order (variables from
# theme.conf and bindings.conf are used by the later files).
source-file ~/.config/tmux/theme.conf
source-file ~/.config/tmux/options.conf
source-file ~/.config/tmux/bindings.conf
source-file ~/.config/tmux/plugins.conf
source-file ~/.config/tmux/statusline.conf

# Last: mirror all prefix bindings onto ЙЦУКЕН letters.
run-shell ~/.config/tmux/tmux-cyrillic-keys.sh
