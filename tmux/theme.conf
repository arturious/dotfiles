# builtin
set -g theme terminal

# panes
set -g window-style fg=colour10,bg=default
set -g window-active-style fg=colour12,bg=default

# messages
set -g mode-style "fg=#eee8d5,bg=#073642"
set -g message-style "fg=#eee8d5,bg=#073642"
set -g message-command-style "fg=#eee8d5,bg=#073642"

# borders
set -g pane-border-style "fg=#073642"
set -g pane-active-border-style "fg=#eee8d5"

# pane numbers
set -g display-panes-active-colour colour33
set -g display-panes-colour colour166

# clock
setw -g clock-mode-colour colour64

# popups
set -g popup-style "bg=default"
set -g popup-border-style "fg=colour167,bg=default"
set -g popup-border-lines rounded

# status
set -g status-style "fg=#29A298,bg=default"

# tabs
setw -g window-status-current-style "default"
setw -g window-status-bell-style "default"
setw -g window-status-activity-style "default"
setw -g window-status-format "#[fg=#{?window_bell_flag,#d33682,#B28500},bg=default]#[fg=#{?window_bell_flag,#EEE8D5,#00141A},bg=#{?window_bell_flag,#d33682,#B28500}]#I #[fg=#00141A,bg=#93A1A1] #{E:@tab-title} #[fg=#93A1A1,bg=default,nobold]"
setw -g window-status-current-format "#[fg=#278BD3,bg=default]#[fg=#00141A,bg=#278BD3]#I #[fg=#00141A,bg=#EEE8D5,bold] #{E:@tab-title} #[fg=#EEE8D5,bg=default,nobold]"
