set -g popup-border-lines rounded

# Prefix F12 = Caps Lock tap (Karabiner -> F18 -> Ghostty -> F12);
# tmux doesn't know F13+.
set -g prefix F12

# Prefix twice -> nested tmux (tmux-claude-hatch's popup).
bind-key -T prefix F12 send-prefix

set -g popup-border-style "fg=${BORDER}"
# tmux 3.8: built-in colors from Ghostty's palette.
set -g theme terminal
# tmux 3.8 made popups gray by default.
set -g popup-style default

# Otherwise the wheel becomes Up/Down and cycles fish history.
# Mouse selection then needs Shift.
set -g mouse on

# 1 line per wheel notch instead of 5.
bind-key -T copy-mode WheelUpPane select-pane \; send-keys -X -N 1 scroll-up
bind-key -T copy-mode WheelDownPane select-pane \; send-keys -X -N 1 scroll-down

set -g base-index 1
set -g renumber-windows on

set -g mode-style "fg=${STATUS},bg=${SELECTION_BG}"

# Claude Code notifies only when its pane is unfocused.
set -g focus-events on

set -g copy-mode-position-format ""

# Border line above the status line.
set -g pane-border-status bottom
set -g pane-border-format ""
set -g pane-border-style "fg=${PANE_INACTIVE},bg=default,bold"
set -g pane-active-border-style "fg=${PANE_ACTIVE},bg=default,bold"

set -g status-style "fg=${STATUS},bg=default"

# Window pills (tabs).
setw -g window-status-bell-style "default"
setw -g window-status-activity-style "default"
setw -g window-status-current-style "default"
setw -g window-status-format "#[fg=#{?window_bell_flag,${TAB_BELL},${TAB_INDEX}},bg=default]#[fg=#{?window_bell_flag,${TAB_BELL_TEXT},${TAB_TEXT}},bg=#{?window_bell_flag,${TAB_BELL},${TAB_INDEX}}]#I #[fg=${TAB_TEXT},bg=${TAB_NAME}] #{E:@tab-title} #[fg=${TAB_NAME},bg=default,nobold]"
setw -g window-status-current-format "#[fg=${TAB_ACTIVE},bg=default]#[fg=${TAB_TEXT},bg=${TAB_ACTIVE}]#I #[fg=${TAB_TEXT},bg=${TAB_ACTIVE_NAME},bold] #{E:@tab-title} #[fg=${TAB_ACTIVE_NAME},bg=default,nobold]"

# Claude Code's binary is named after its version (e.g. "2.1.260").
set -g automatic-rename-format "#{s/^[0-9]+\.[0-9]+\.[0-9]+$/claude/:#{pane_current_command}}#{?pane_dead,[dead],}"

# osc7: cwd for Ghostty's tab icon; progressbar: OSC 9;4 from Claude Code.
# Fixed index, not -a: otherwise prefix+r adds a duplicate each time.
set -s terminal-features[10] 'xterm-ghostty:osc7:progressbar'

set -g set-titles on
set -g set-titles-string "#{pane_current_command} · #{?#{==:#{pane_current_path},$HOME},~,#{b:pane_current_path}}"

# Forward Claude Code's notifications and progress bar to Ghostty.
set -g allow-passthrough on

# No confirmation prompt.
bind-key & kill-window
bind-key x kill-pane

# Pane's cwd, or Claude's cwd (@claude_cwd from claude/statusline.py)
# while Claude Code runs in it.
%hidden WORK_DIR="#{?#{&&:#{@claude_cwd},#{m/r:^[0-9]+[.][0-9]+[.][0-9]+$,#{pane_current_command}}},#{@claude_cwd},#{pane_current_path}}"

bind-key g display-popup -E -xC -yC -w 95% -h 95% -b rounded -S "fg=${BORDER_LAZYGIT}" \
  -T " lazygit " -d "${WORK_DIR}" lazygit

# Window / session picker with live preview; the last arg marks the current row.
bind-key w display-popup -E -b rounded -S "fg=${BORDER_WINDOWS}" -T " Windows " -w 90% -h 90% \
  "~/.config/tmux/tmux-picker.sh windows '${TAB_ACTIVE}'"
bind-key s display-popup -E -b rounded -S "fg=${BORDER_SESSIONS}" -T " Sessions " -w 90% -h 90% \
  "~/.config/tmux/tmux-picker.sh sessions '${TAB_ACTIVE}'"

# Keys from Ghostty (ghostty/config.ghostty), no prefix needed.
set -s user-keys[0] "\036t"
set -s user-keys[1] "\036p"
set -s user-keys[2] "\036n"
set -s user-keys[3] "\036P"
set -s user-keys[4] "\036N"
# Cmd+T: new window in ~.
bind-key -n User0 new-window -c "$HOME"
# Cmd+[ / Cmd+]: previous/next window.
bind-key -n User1 previous-window
bind-key -n User2 next-window
# Cmd+Shift+[ / Cmd+Shift+]: move the window; -d keeps focus on it.
bind-key -n User3 swap-window -d -t -1
bind-key -n User4 swap-window -d -t +1
# Cmd+1..9: window N.
set -s user-keys[5] "\0361"
set -s user-keys[6] "\0362"
set -s user-keys[7] "\0363"
set -s user-keys[8] "\0364"
set -s user-keys[9] "\0365"
set -s user-keys[10] "\0366"
set -s user-keys[11] "\0367"
set -s user-keys[12] "\0368"
set -s user-keys[13] "\0369"
bind-key -n User5 select-window -t :=1
bind-key -n User6 select-window -t :=2
bind-key -n User7 select-window -t :=3
bind-key -n User8 select-window -t :=4
bind-key -n User9 select-window -t :=5
bind-key -n User10 select-window -t :=6
bind-key -n User11 select-window -t :=7
bind-key -n User12 select-window -t :=8
bind-key -n User13 select-window -t :=9

bind-key r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# prefix+y Claude popup for the current dir, prefix+d detach, prefix+u picker.
set -g @plugin 'craftzdog/tmux-claude-hatch'
# Picker opens in nav mode: j/k move, x kill, q close, i/a filter, esc back.
set -g @claude_fzf_options "\
  --prompt 'nav> ' \
  --bind 'j:down' \
  --bind 'k:up' \
  --bind 'q:abort' \
  --bind 'x:execute-silent(kill {3})+reload(sleep 0.3; \$CLAUDE_PICKER --list)' \
  --bind 'i:unbind(j,k,q,i,a,x)+change-prompt(filter> )' \
  --bind 'a:unbind(j,k,q,i,a,x)+change-prompt(filter> )' \
  --bind 'esc:rebind(j,k,q,i,a,x)+change-prompt(nav> )'"

# claude-code-cleaner (local, not via TPM): prefix+X.
set -g @claude_cleaner_border_style "fg=${BORDER_CLAUDE}"
set -g @claude_cleaner_title " Claude sessions "
if-shell 'test -f ~/dev/claude-code-cleaner/claude_code_cleaner.tmux' \
  'run-shell ~/dev/claude-code-cleaner/claude_code_cleaner.tmux'

# Otherwise TPM would install into ~/.config/tmux/plugins, i.e. this repo.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

# Must come after every @plugin line.
run '~/.tmux/plugins/tpm/tpm'

# After the tpm run line, so these override the plugins' bindings.
# prefix+U: update all plugins without TPM's name prompt.
bind-key U display-popup -E -w 70% -h 50% \
  "bash -c '~/.tmux/plugins/tpm/bin/update_plugins all; echo; read -n 1 -s -p \"Press any key...\"'"

# prefix+y/u: tmux-claude-hatch in orange borders. run-shell blocks (no -b),
# so the border color is restored after the popup closes.
bind-key -T prefix y \
  set-option -g popup-border-style "fg=${BORDER_CLAUDE}" \; \
  run-shell "~/.tmux/plugins/tmux-claude-hatch/scripts/launch.sh '#{q:pane_current_path}' '#{q:window_id}'" \; \
  set-option -g popup-border-style "fg=${BORDER}"
bind-key -T prefix u \
  set-option -g popup-border-style "fg=${BORDER_CLAUDE}" \; \
  run-shell "~/.tmux/plugins/tmux-claude-hatch/scripts/list.sh '#{q:client_name}'" \; \
  set-option -g popup-border-style "fg=${BORDER}"

# Last: mirror all prefix bindings onto ЙЦУКЕН letters.
run-shell ~/.config/tmux/tmux-cyrillic-keys.sh

set -g status on
set -g status-position bottom
# Pill title: the folder name (Claude's own folder while it runs).
set -g @tab-title "#{?#{==:${WORK_DIR},$HOME},~,#{s|.*/||:${WORK_DIR}}}"

set -g status-left ""
set -g status-right "#{?client_prefix,#[fg=${PREFIX_FG}]#[bg=${PREFIX_BG}]#[bold] PREFIX #[default],}"
