# Started by fish in Ghostty (see fish/config.fish): one session "main",
# windows as tabs, popups for fzf / lazygit / Claude. Closing Ghostty only
# detaches - "main" keeps its windows for the next launch.
set -g popup-border-lines rounded

# Prefix is F12: Caps Lock tapped on its own sends it (Karabiner rule,
# Ghostty only). The MacBook's own F12 key is volume up, so no real shortcut
# is taken. (tmux knows only F1-F12, F13+ are "bad key".)
set -g prefix F12

# tmux's default "press prefix twice to send it through" is bound to the
# stock prefix (C-b) — rebind it to ours, needed to get the prefix key
# through to a nested tmux client (e.g. tmux-claude-hatch's
# popup, which runs `tmux attach-session` inside itself).
bind-key -T prefix F12 send-prefix

# Popup border in Solarized Dark Patched's comment color (config.ghostty),
# so tmux popups (fzf --tmux, prefix+U) match the theme.
set -g popup-border-style "fg=${BORDER}"
# tmux 3.8 themes: built-in colours (menus, choose-tree, messages) come from
# Ghostty's palette instead of tmux's own light/dark theme. This only changes
# what the theme colour names render as - it doesn't reset 3.8's new
# defaults, hence the two explicit fixes (here and window-status-current-style).
set -g theme terminal

# tmux 3.8 made popups gray by default (bg=themedarkgrey); keep them on the
# terminal's own background like before.
set -g popup-style default

# Without this, tmux never claims mouse events, so Ghostty falls back to
# emulating wheel scroll as Up/Down arrow key presses (the standard xterm
# behavior when no app has enabled real mouse tracking) — which just cycles
# fish's command history instead of scrolling. With mouse on, wheel scroll
# properly enters copy-mode and scrolls the pane's actual output.
# Trade-off: selecting text with the mouse now needs Shift held, since plain
# drag-select goes to tmux instead of the terminal.
set -g mouse on

# Scroll 1 line per wheel notch instead of tmux's default 5 - finer-grained,
# feels smoother (true pixel/sub-line smooth scrolling isn't possible in a
# character-grid terminal, this is the closest approximation).
bind-key -T copy-mode WheelUpPane select-pane \; send-keys -X -N 1 scroll-up
bind-key -T copy-mode WheelDownPane select-pane \; send-keys -X -N 1 scroll-down

# Windows numbered from 1 (like the tab pills read), and renumbered when one
# closes - 1 2 3, never 1 3.
set -g base-index 1
set -g renumber-windows on

# Text-selection highlight in copy-mode.
set -g mode-style "fg=${STATUS},bg=${SELECTION_BG}"

# Let apps inside tmux (Claude Code) know whether their pane is focused, e.g.
# to only notify when you're looking elsewhere.
set -g focus-events on

# Hide copy-mode's position-counter indicator in the top-right corner
# (separate option from mode-style above, tmux 3.2+).
set -g copy-mode-position-format ""

set -g pane-border-status bottom
# Claude status segment: " ✻ working ──" with the spinner from fish's `c`
# animating while Claude works (#{A:...}, tmux 3.8), " ● idle ──" /
# " ● waiting ──" otherwise, nothing when no Claude runs in the pane. The
# script only prints the state; the same #() string repeated below is one job.
%hidden CLAUDE_STATE="#(~/.config/tmux/tmux-claude-status.sh '#{pane_tty}')"
%hidden PANE_BORDER="#{?pane_active,${PANE_ACTIVE},${PANE_INACTIVE}}"
%hidden CLAUDE_TAIL="#[fg=${PANE_TEXT}]"
%hidden CLAUDE_SEGMENT="#{?#{==:${CLAUDE_STATE},busy}, #[fg=${CLAUDE_BUSY}]#{A:·,✢,✳,✶,✻,✽,✽,✻,✶,✳,✢,·} ${CLAUDE_TAIL}working #[fg=${PANE_BORDER}]──,#{?#{==:${CLAUDE_STATE},idle}, #[fg=${CLAUDE_IDLE}]● ${CLAUDE_TAIL}idle #[fg=${PANE_BORDER}]──,#{?#{==:${CLAUDE_STATE},waiting}, #[fg=${CLAUDE_WAITING}]● ${CLAUDE_TAIL}waiting #[fg=${PANE_BORDER}]──,#{?${CLAUDE_STATE}, #[fg=${CLAUDE_UNKNOWN}]● ${CLAUDE_TAIL}? #[fg=${PANE_BORDER}]──,}}}}"
set -g pane-border-format "#[align=right]#(~/.config/tmux/tmux-pane-port.sh '#{pane_tty}' '#{?pane_active,${PANE_ACTIVE},${PANE_INACTIVE}}' '${PANE_COMMAND}')${CLAUDE_SEGMENT} #[fg=${PANE_COMMAND}]#{s/^[0-9]+\.[0-9]+\.[0-9]+$/claude/:pane_current_command} #[fg=#{?pane_active,${PANE_ACTIVE},${PANE_INACTIVE}}]───"
set -g pane-border-style "fg=${PANE_INACTIVE},bg=default,bold"
set -g pane-active-border-style "fg=${PANE_ACTIVE},bg=default,bold"

# Also how often the pane-border #() scripts (port, Claude status) re-run -
# each run is ps/lsof per pane, so not every second.
set -g status-interval 2

set -g status-style "fg=${STATUS},bg=default"

set -g status-left ""
set -g status-right "#{?client_prefix,#[fg=${PREFIX_FG}]#[bg=${PREFIX_BG}]#[bold] PREFIX #[default],}"

# GUI-tab look modeled on jabirali/tmux-powertab (recreated by hand, not
# installed as a plugin - it is archived/unmaintained - using our own
# colors instead of its default Solarized Light).
# Default for both is "reverse", applied on top of the formats below - it
# inverts the whole pill. The formats color the bell state themselves
# (window_bell_flag), so neutralize these.
setw -g window-status-bell-style "default"
setw -g window-status-activity-style "default"
# tmux 3.8 underlines the current window by default (underscore), drawn
# under the number of the current pill - the formats style it themselves.
setw -g window-status-current-style "default"
# A fresh pane's title is the hostname until fish sets its own; show "*"
# for that instead of flashing the Mac's name.
setw -g window-status-format "#[fg=#{?window_bell_flag,${TAB_BELL},${TAB_INDEX}},bg=default]#[fg=#{?window_bell_flag,${TAB_BELL_TEXT},${TAB_TEXT}},bg=#{?window_bell_flag,${TAB_BELL},${TAB_INDEX}}]#I #[fg=${TAB_TEXT},bg=${TAB_NAME}] #{?#{==:#T,#{host}},*,#T} #[fg=${TAB_NAME},bg=default,nobold]"
setw -g window-status-current-format "#[fg=${TAB_ACTIVE},bg=default]#[fg=${TAB_TEXT},bg=${TAB_ACTIVE}]#I #[fg=${TAB_TEXT},bg=${TAB_ACTIVE_NAME},bold] #{?#{==:#T,#{host}},*,#T} #[fg=${TAB_ACTIVE_NAME},bg=default,nobold]"

# Claude Code's binary on disk is named after its version (e.g. "2.1.260"),
# so automatic-rename would otherwise show that instead of "claude".
set -g automatic-rename-format "#{s/^[0-9]+\.[0-9]+\.[0-9]+$/claude/:#{pane_current_command}}#{?pane_dead,[dead],}"

# Ghostty features tmux doesn't detect on its own (true color comes from
# xterm-ghostty's terminfo, which already has Tc):
#   osc7        - forward the working directory so tabs keep their folder
#                 icon instead of Ghostty's default (ghost) icon
#   progressbar - forward OSC 9;4 (Claude Code's progress) to Ghostty
# Fixed index, not -a: appending would add a duplicate on every prefix+r.
set -s terminal-features[10] 'xterm-ghostty:osc7:progressbar'

set -g set-titles on
set -g set-titles-string "#{?#{==:#T,#{host}},*,#T}"

# Without this, tmux swallows desktop notifications (Claude Code's
# preferredNotifChannel) and Ghostty's OSC 9;4 progress bar instead of
# forwarding them to the outer terminal - both ride the same passthrough
# mechanism, gated by this option plus the progressbar feature above.
set -g allow-passthrough on

# Ghostty sends private escape sequences for these (see config.ghostty);
# bound directly in the root key table, no prefix needed.
# Cmd+[ / Cmd+]: previous/next window.
set -s user-keys[0] "\036p"
set -s user-keys[1] "\036n"
bind-key -n User0 previous-window
bind-key -n User1 next-window

# Cmd+T: new window.
set -s user-keys[2] "\036t"
bind-key -n User2 new-window

# Cmd+Shift+[ / Cmd+Shift+]: move the current window one place left/right.
# -d keeps focus on the window being moved.
set -s user-keys[3] "\036P"
set -s user-keys[4] "\036N"
bind-key -n User3 swap-window -d -t -1
bind-key -n User4 swap-window -d -t +1

# Close the current window/pane without a confirmation prompt.
bind-key & kill-window
bind-key x kill-pane

# The pane's working directory - or, while Claude Code runs in it (its
# binary is named after its version), Claude's own directory, which its
# statusline stores in @claude_cwd (claude/statusline.py): the claude process
# stays where it was started, so pane_current_path wouldn't follow a cd.
%hidden WORK_DIR="#{?#{&&:#{@claude_cwd},#{m/r:^[0-9]+[.][0-9]+[.][0-9]+$,#{pane_current_command}}},#{@claude_cwd},#{pane_current_path}}"

# Pop up lazygit for the current pane's directory (prefix + g).
bind-key g display-popup -E -xC -yC -w 95% -h 95% -b rounded -S "fg=${BORDER_LAZYGIT}" \
  -T " lazygit " -d "${WORK_DIR}" lazygit

# prefix+w / prefix+s: window / session list in a popup with a live preview
# (instead of the built-in choose-tree), like tmux-claude-hatch's prefix+u.
# The last argument is the color marking the current row.
bind-key w display-popup -E -b rounded -S "fg=${BORDER_WINDOWS}" -T " Windows " -w 90% -h 90% \
  "~/.config/tmux/tmux-picker.sh windows '${TAB_ACTIVE}'"
bind-key s display-popup -E -b rounded -S "fg=${BORDER_SESSIONS}" -T " Sessions " -w 90% -h 90% \
  "~/.config/tmux/tmux-picker.sh sessions '${TAB_ACTIVE}'"

# Reload settings
bind-key r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# TPM (tmux plugin manager, cloned by install.sh) - only for
# tmux-claude-hatch. Defaults:
# prefix+y launch/attach a Claude session for the current dir in a popup,
# prefix+d detach (session keeps running), prefix+u opens the fzf agent
# picker (live preview, ctrl-x kill, ctrl-y copy location) - none collide
# with prefix+g above.
set -g @plugin 'craftzdog/tmux-claude-hatch'

# claude-code-cleaner (~/dev/claude-code-cleaner, loaded directly, not via tpm):
# prefix+X opens a popup to preview and trash old Claude Code sessions.
set -g @claude_cleaner_border_style "fg=${BORDER_CLAUDE}"
set -g @claude_cleaner_title " Claude sessions "
if-shell 'test -f ~/dev/claude-code-cleaner/claude_code_cleaner.tmux' \
  'run-shell ~/dev/claude-code-cleaner/claude_code_cleaner.tmux'

# Plugins live in ~/.tmux/plugins, not in the repo: with the config in
# ~/.config/tmux, TPM would otherwise use ~/.config/tmux/plugins, which is
# this dotfiles folder.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

# After every @plugin line.
run '~/.tmux/plugins/tpm/tpm'

# prefix+U: update all TPM plugins in a popup and show the result, instead of
# TPM's own prompt for a plugin name. After the tpm run line, so this
# replaces TPM's binding.
bind-key U display-popup -E -w 70% -h 50% \
  "bash -c '~/.tmux/plugins/tpm/bin/update_plugins all; echo; read -n 1 -s -p \"Press any key...\"'"

# Rebind prefix+y/u (must come after the tpm run line above, so ours wins
# over the plugin's own bind-key calls) to wrap tmux-claude-hatch's popups in
# Claude's orange instead of the gray popup-border-style used everywhere else
# (fzf, prefix+U). run-shell blocks here (no -b), same as the plugin's own
# calls, so the color is restored only once the popup has actually closed.
bind-key -T prefix y \
  set-option -g popup-border-style "fg=${BORDER_CLAUDE}" \; \
  run-shell "~/.tmux/plugins/tmux-claude-hatch/scripts/launch.sh '#{q:pane_current_path}' '#{q:window_id}'" \; \
  set-option -g popup-border-style "fg=${BORDER}"
bind-key -T prefix u \
  set-option -g popup-border-style "fg=${BORDER_CLAUDE}" \; \
  run-shell "~/.tmux/plugins/tmux-claude-hatch/scripts/list.sh '#{q:client_name}'" \; \
  set-option -g popup-border-style "fg=${BORDER}"

# Last: copy every prefix binding above (and the plugins') onto its Russian
# letter, so prefix+ц = prefix+w on the ЙЦУКЕН layout. See the script.
run-shell ~/.config/tmux/tmux-cyrillic-keys.sh
