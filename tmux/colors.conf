# %hidden: config-only, not exported to programs' environment.

# --- Palette: Solarized Dark, matching Ghostty -----------------------------
%hidden GREEN="#859900"
%hidden YELLOW="#B28500"
%hidden ORANGE="#D77757"            # Claude's orange
%hidden MAGENTA="#d33682"
%hidden BLUE="#278BD3"
%hidden CYAN="#29A298"
%hidden BASE03="#00141A"            # darkest background
%hidden BASE01="#475b62"
%hidden BASE1="#93A1A1"
%hidden BASE2="#EEE8D5"
%hidden GRAY="#3a3a3a"
%hidden WHITE="white"
%hidden RED="red"

# --- Where each one is used -------------------------------------------------
# Popup borders
%hidden BORDER="${BASE01}"          # fzf, prefix+U
%hidden BORDER_LAZYGIT="${GREEN}"   # prefix+g
%hidden BORDER_CLAUDE="${ORANGE}"   # Claude popups: prefix+y/u, prefix+X
%hidden BORDER_WINDOWS="${GREEN}"   # prefix+w
%hidden BORDER_SESSIONS="${GREEN}"  # prefix+s

# Pane borders
%hidden PANE_ACTIVE="${YELLOW}"
%hidden PANE_INACTIVE="${GREEN}"

# Status line
%hidden STATUS="${CYAN}"            # copy-mode selection text
%hidden SELECTION_BG="${GRAY}"      # copy-mode selection background
%hidden PREFIX_FG="${WHITE}"
%hidden PREFIX_BG="${RED}"

# Window pills (tabs); TAB_ACTIVE also marks the current row in prefix+w/s
%hidden TAB_INDEX="${YELLOW}"       # number segment
%hidden TAB_NAME="${BASE1}"         # name segment
%hidden TAB_TEXT="${BASE03}"        # dark text on the pills
%hidden TAB_BELL="${MAGENTA}"       # number segment when the window rang
%hidden TAB_BELL_TEXT="${BASE2}"
%hidden TAB_ACTIVE="${BLUE}"        # current window: number segment
%hidden TAB_ACTIVE_NAME="${BASE2}"  # current window: name segment
