# All tmux colors in one place (sourced by tmux.conf before settings.conf).
# Change a value and press prefix+r. %hidden: visible to the config only, not
# exported to programs' environment.

# --- Palette: Solarized Dark shades, matching Ghostty's theme ---------------
%hidden GREEN="#859900"
%hidden YELLOW="#B28500"
%hidden ORANGE="#D77757"            # Claude's orange
%hidden MAGENTA="#d33682"
%hidden BLUE="#278BD3"
%hidden CYAN="#29A298"
%hidden BASE03="#00141A"            # darkest background
%hidden BASE01="#475b62"            # comments
%hidden BASE1="#93A1A1"             # secondary text
%hidden BASE2="#EEE8D5"             # light text
%hidden GRAY="#3a3a3a"
%hidden WHITE="white"
%hidden RED="red"

# --- Where each one is used -------------------------------------------------
# Popup borders
%hidden BORDER="${BASE01}"          # fzf, lazygit, prefix+U
%hidden BORDER_CLAUDE="${ORANGE}"   # Claude popups: prefix+y/u, prefix+X
%hidden BORDER_WINDOWS="${GREEN}"   # prefix+w

# Pane borders
%hidden PANE_ACTIVE="${YELLOW}"     # border + segments of the focused pane
%hidden PANE_INACTIVE="${GREEN}"     # ... of the other panes
%hidden PANE_COMMAND="${GREEN}"     # running command, listening ports
%hidden PANE_TEXT="${BASE1}"        # Claude status text ("idle", "waiting")

# Status line
%hidden STATUS="${CYAN}"            # status text, copy-mode selection text
%hidden SELECTION_BG="${GRAY}"      # copy-mode selection background
%hidden PREFIX_FG="${WHITE}"        # PREFIX indicator
%hidden PREFIX_BG="${RED}"

# Window pills (tabs)
%hidden TAB_INDEX="${YELLOW}"       # number segment
%hidden TAB_NAME="${BASE1}"         # name segment
%hidden TAB_TEXT="${BASE03}"        # dark text on the pills
%hidden TAB_BELL="${MAGENTA}"       # number segment when the window rang
%hidden TAB_BELL_TEXT="${BASE2}"
%hidden TAB_ACTIVE="${BLUE}"        # current window: number segment
%hidden TAB_ACTIVE_NAME="${BASE2}"  # current window: name segment
