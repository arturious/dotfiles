# Started by fish in every Ghostty window (see fish/config.fish): windows as
# tabs, per-window grouped sessions, popups for fzf / lazygit / Claude.
set -g popup-border-lines rounded

# Prefix is a single raw control byte (0x1D, Ctrl+]), sent by Cmd+P (see
# config.ghostty) - not a multi-byte user-keys sequence: those stop
# registering once an interactive tmux popup (e.g. tmux-claude-hatch's
# launcher) grabs input, while a single control byte keeps working.
set -g prefix 'C-]'

# tmux's default "press prefix twice to send it through" is bound to the
# stock prefix (C-b) — rebind it to ours, needed to get the prefix key
# through to a nested tmux client (e.g. tmux-claude-hatch's
# popup, which runs `tmux attach-session` inside itself).
bind-key -T prefix 'C-]' send-prefix

# Popup border in Solarized Dark Patched's comment color (config.ghostty),
# so tmux popups (fzf --tmux, lazygit on prefix+g) match the theme.
set -g popup-border-style 'fg=#475b62'

# Without this, tmux never claims mouse events, so Ghostty falls back to
# emulating wheel scroll as Up/Down arrow key presses (the standard xterm
# behavior when no app has enabled real mouse tracking) — which just cycles
# fish's command history instead of scrolling. With mouse on, wheel scroll
# properly enters copy-mode and scrolls the pane's actual output.
# Trade-off: selecting text with the mouse now needs Shift held, since plain
# drag-select goes to tmux instead of the terminal.
set -g mouse on

# Scroll 1 line per wheel notch instead of tmux's default 5 - finer-grained,
# feels smoother (true pixel/sub-line smooth scrolling isn't possible in a
# character-grid terminal, this is the closest approximation).
bind-key -T copy-mode WheelUpPane select-pane \; send-keys -X -N 1 scroll-up
bind-key -T copy-mode WheelDownPane select-pane \; send-keys -X -N 1 scroll-down

# Each Ghostty tab gets its own grouped session (see config.fish) so window
# switching (Cmd+[ / Cmd+]) is per-tab, not shared across every tab. Kill that
# session the moment its tab closes so they don't pile up (windows survive as
# long as another grouped session still references them). Only grouped
# sessions: tmux-claude-hatch's Claude sessions are detached on purpose
# (prefix+d) and must keep running.
set-hook -g client-detached 'if -F "#{session_grouped}" kill-session'

# Text-selection highlight in copy-mode.
set -g mode-style "fg=#29A298,bg=#3a3a3a"

# Hide copy-mode's position-counter indicator in the top-right corner
# (separate option from mode-style above, tmux 3.2+).
set -g copy-mode-position-format ""

set -g pane-border-status bottom
set -g pane-border-format "#[align=right]#(~/.config/tmux/tmux-pane-port.sh '#{pane_tty}' '#{?pane_active,#B28500,#849902}')#(~/.config/tmux/tmux-claude-status.sh '#{pane_tty}' '#{?pane_active,#B28500,#849902}') #[fg=#859900]#{s/^[0-9]+\.[0-9]+\.[0-9]+$/claude/:pane_current_command} #[fg=#{?pane_active,#B28500,#849902}]───"
set -g pane-border-style "fg=#849902,bg=default,bold"
set -g pane-active-border-style "fg=#B28500,bg=default,bold"

# Also how often the pane-border #() scripts (port, Claude status) re-run -
# each run is ps/lsof per pane, so not every second.
set -g status-interval 2

set -g status-style "fg=#29A298,bg=default"

set -g status-left ""
set -g status-right "#{?client_prefix,#[fg=white]#[bg=red]#[bold] PREFIX #[default],}"

# GUI-tab look modeled on jabirali/tmux-powertab (recreated by hand, not
# installed as a plugin - it is archived/unmaintained - using our own
# colors instead of its default Solarized Light).
# Default for both is "reverse", applied on top of the formats below - it
# inverts the whole pill. The formats color the bell state themselves
# (window_bell_flag), so neutralize these.
setw -g window-status-bell-style "default"
setw -g window-status-activity-style "default"
# A fresh pane's title is the hostname until fish (and its greeting)
# set their own; show "*" for that instead of flashing the Mac's name.
setw -g window-status-format "#[fg=#{?window_bell_flag,#d33682,#B28500},bg=default]#[fg=#{?window_bell_flag,#EEE8D5,#00141A},bg=#{?window_bell_flag,#d33682,#B28500}]#I #[fg=#00141A,bg=#93A1A1] #{?#{==:#T,#{host}},*,#T} #[fg=#93A1A1,bg=default,nobold]"
setw -g window-status-current-format "#[fg=#278BD3,bg=default]#[fg=#00141A,bg=#278BD3]#I #[fg=#00141A,bg=#EEE8D5,bold] #{?#{==:#T,#{host}},*,#T} #[fg=#EEE8D5,bg=default,nobold]"

# Claude Code's binary on disk is named after its version (e.g. "2.1.260"),
# so automatic-rename would otherwise show that instead of "claude".
set -g automatic-rename-format "#{s/^[0-9]+\.[0-9]+\.[0-9]+$/claude/:#{pane_current_command}}#{?pane_dead,[dead],}"

# Ghostty features tmux doesn't detect on its own (true color comes from
# xterm-ghostty's terminfo, which already has Tc):
#   osc7        - forward the working directory so tabs keep their folder
#                 icon instead of Ghostty's default (ghost) icon
#   progressbar - forward OSC 9;4 (Claude Code's progress) to Ghostty
# Fixed index, not -a: appending would add a duplicate on every prefix+r.
set -s terminal-features[10] 'xterm-ghostty:osc7:progressbar'

set -g set-titles on
set -g set-titles-string "#{?#{==:#T,#{host}},*,#T}"

# Without this, tmux swallows desktop notifications (Claude Code's
# preferredNotifChannel) and Ghostty's OSC 9;4 progress bar instead of
# forwarding them to the outer terminal - both ride the same passthrough
# mechanism, gated by this option plus the progressbar feature above.
set -g allow-passthrough on

# Ghostty sends private escape sequences for these (see config.ghostty);
# bound directly in the root key table, no prefix needed.
# Cmd+[ / Cmd+]: previous/next window.
set -s user-keys[0] "\036p"
set -s user-keys[1] "\036n"
bind-key -n User0 previous-window
bind-key -n User1 next-window

# Cmd+T: new window.
set -s user-keys[2] "\036t"
bind-key -n User2 new-window

# Cmd+Shift+[ / Cmd+Shift+]: move the current window one place left/right.
# -d keeps focus on the window being moved.
set -s user-keys[3] "\036P"
set -s user-keys[4] "\036N"
bind-key -n User3 swap-window -d -t -1
bind-key -n User4 swap-window -d -t +1

# Close the current window/pane without a confirmation prompt.
bind-key & kill-window
bind-key x kill-pane

# Pop up lazygit for the current pane's directory (prefix + g).
bind-key g display-popup -E -xC -yC -w 80% -h 80% -d "#{pane_current_path}" lazygit

# Reload settings
bind-key r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# TPM (tmux plugin manager, cloned by install.sh) - only for
# tmux-claude-hatch. Defaults:
# prefix+y launch/attach a Claude session for the current dir in a popup,
# prefix+d detach (session keeps running), prefix+u opens the fzf agent
# picker (live preview, ctrl-x kill, ctrl-y copy location) - none collide
# with prefix+g above.
set -g @plugin 'craftzdog/tmux-claude-hatch'

# claude-code-cleaner (~/dev/claude-code-cleaner, loaded directly, not via tpm):
# prefix+X opens a popup to preview and trash old Claude Code sessions.
set -g @claude_cleaner_border_style 'fg=#D77757'
if-shell 'test -f ~/dev/claude-code-cleaner/claude_code_cleaner.tmux' \
  'run-shell ~/dev/claude-code-cleaner/claude_code_cleaner.tmux'

# After every @plugin line.
run '~/.tmux/plugins/tpm/tpm'

# Rebind prefix+y/u (must come after the tpm run line above, so ours wins
# over the plugin's own bind-key calls) to wrap tmux-claude-hatch's popups in
# Claude's orange instead of the gray popup-border-style used everywhere else
# (fzf, lazygit). run-shell blocks here (no -b), same as the plugin's own
# calls, so the color is restored only once the popup has actually closed.
bind-key -T prefix y \
  set-option -g popup-border-style 'fg=#D77757' \; \
  run-shell "~/.tmux/plugins/tmux-claude-hatch/scripts/launch.sh '#{q:pane_current_path}' '#{q:window_id}'" \; \
  set-option -g popup-border-style 'fg=#475b62'
bind-key -T prefix u \
  set-option -g popup-border-style 'fg=#D77757' \; \
  run-shell "~/.tmux/plugins/tmux-claude-hatch/scripts/list.sh '#{q:client_name}'" \; \
  set-option -g popup-border-style 'fg=#475b62'
