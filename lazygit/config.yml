gui:
  spinner:
    frames:
      - '·'
      - '✢'
      - '✳'
      - '✶'
      - '✻'
      - '✽'
      - '✽'
      - '✻'
      - '✶'
      - '✳'
      - '✢'
      - '·'
    rate: 120
git:
  diffRenderers:
    - command: delta --dark --syntax-theme="Solarized (dark)" --paging=never
customCommands:
  - key: "C"
    command: "git cz"
    description: "commit with commitizen"
    context: "files"
    loadingText: "opening commitizen commit tool"
    output: terminal
