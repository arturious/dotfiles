gui:
  # Custom loading-spinner animation: 0,1,2,3,4,5,5,4,3,2,1,0 through the
  # glyphs below (used e.g. while Ctrl+A's commit-message prompt below is
  # computing its initialValue via Claude, before the popup can appear).
  spinner:
    frames:
      - '·'
      - '✢'
      - '✳'
      - '✶'
      - '✻'
      - '✽'
      - '✽'
      - '✻'
      - '✶'
      - '✳'
      - '✢'
      - '·'
    rate: 120

customCommands:
  - key: '<c-a>'
    context: 'files'
    description: 'AI: generate commit message (Claude)'
    loadingText: 'Generating commit message…'
    prompts:
      - type: 'input'
        title: 'Commit message (generated by Claude — edit before confirming)'
        key: 'Message'
        initialValue: "{{ runCommand \"/Users/r/.local/bin/lazygit-ai-commit-msg\" }}"
    command: 'git commit -m {{.Form.Message | quote}}'
