customCommands:
  - key: '<c-a>'
    context: 'files'
    description: 'AI: generate commit message (Claude)'
    prompts:
      - type: 'input'
        title: 'Commit message (generated by Claude — edit before confirming)'
        key: 'Message'
        initialValue: "{{ runCommand \"/Users/r/.local/bin/lazygit-ai-commit-msg\" }}"
    command: 'git commit -m {{.Form.Message | quote}}'
